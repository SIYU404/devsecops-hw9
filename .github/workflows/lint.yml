name: Linting

on: [push, pull_request]

# 1. 賦予整個 Workflow 最小權限（唯讀）
permissions:
  contents: read

jobs:
  flake8:
    runs-on: ubuntu-latest
    steps:
      # 2. 將版本號鎖定為完整的 Commit SHA，防範供應鏈竄改
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce38c38 # v5.4.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install flake8 flake8-bandit
      - name: Run linter
        run: flake8 .
